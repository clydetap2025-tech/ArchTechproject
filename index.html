<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DayTrace — дневник атмосферы дня</title>
  <meta name="description" content="Личный дневник, который превращает текст, фото и песню дня в живое воспоминание.">
  <link rel="icon" href="brand.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/archive.css">
  <link rel="stylesheet" href="css/book-intro.css">
</head>
<body>
  <svg class="glass-filter-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="container-glass" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="1" seed="1" result="turbulence"/>
        <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise"/>
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="70" xChannelSelector="R" yChannelSelector="B" result="displaced"/>
        <feGaussianBlur in="displaced" stdDeviation="4" result="finalBlur"/>
        <feComposite in="finalBlur" in2="finalBlur" operator="over"/>
      </filter>
    </defs>
  </svg>
  <a class="skip" href="#view">К содержимому</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="DayTrace — на главную">
      <img class="brand-mark" src="brand.svg" width="38" height="38" alt="">
      <span class="brand-name">Day<span>Trace</span></span>
    </a>
    <nav class="nav" aria-label="Основная навигация">
      <a href="#/archive" data-nav>Архив</a>
      <a href="#/account" id="account-link" data-nav>Войти</a>
    </nav>
  </header>
  <main id="view" tabindex="-1">
    <section id="startup" class="wrap startup" aria-live="polite">
      <p class="muted" id="startup-status">Открываю дневник…</p>
      <p id="startup-help" hidden><a class="btn" id="startup-link" href="http://localhost:8080/">Открыть локальный дневник</a></p>
      <noscript><p>Включите JavaScript, чтобы открыть дневник.</p></noscript>
    </section>
  </main>
  <div id="toast" class="toasts" aria-live="polite"></div>
  <dialog class="book-intro" id="book-intro" aria-label="Дневник открывается">
    <div class="book-stage" aria-hidden="true">
      <div class="book-shadow"></div>
      <div class="book-model">
        <div class="book-board book-base"></div>
        <div class="book-edge edge-fore"></div><div class="book-edge edge-foot"></div>
        <div class="book-edge edge-head"></div><div class="book-binding"></div>
        <div class="book-spread">
          <div class="book-print"></div><span class="book-section">DayTrace</span>
        </div>
        <div class="book-ribbon"></div>
        <div class="book-lid">
          <div class="book-lining"></div>
          <div class="book-board book-cloth">
            <div class="book-foil">
              <span class="book-imprint">Личный дневник</span>
              <span class="book-title">Day<i>Trace</i></span>
              <img class="book-emblem" src="brand.svg" width="100" height="100" alt="">
            </div>
          </div>
        </div>
      </div>
    </div>
    <button type="button" class="book-skip" autofocus>Пропустить <span aria-hidden="true">→</span></button>
  </dialog>
  <script>
    const startup = document.getElementById('startup');
    const showStartupHelp = (message, url, label) => {
      if (!startup.isConnected) return;
      document.getElementById('startup-status').textContent = message;
      const link = document.getElementById('startup-link');
      link.href = url;
      link.textContent = label;
      document.getElementById('startup-help').hidden = false;
    };
    if (location.protocol === 'file:') {
      showStartupHelp('Дневник открыт как файл. Откройте адрес локального сервера в браузере.', 'http://localhost:8080/', 'Перейти к дневнику ↗');
    } else {
      import('./js/book-intro.js').then(book => book.openBook()).catch(console.warn);
      setTimeout(() => {
        showStartupHelp('Дневник загружается дольше обычного. Попробуйте обновить страницу.', location.href, 'Обновить страницу');
      }, 12000);
      import('./js/app.js').catch(error => {
        console.error('Не удалось загрузить приложение', error);
        showStartupHelp('Не удалось загрузить файлы дневника. Обновите страницу и попробуйте ещё раз.', location.href, 'Обновить страницу');
      });
    }
  </script>
</body>
</html>
